services:
  - type: web
    name: staffsync-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: staffsync-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: staffsync-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12

databases:
  - name: staffsync-postgres
    databaseName: attendance_db
    user: attendance_user
    plan: starter
    region: oregon
