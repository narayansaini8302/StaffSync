services:
  - type: web
    name: staffsync-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=apps/backend/prisma/schema.prisma && npm run build --workspace=apps/backend
    startCommand: node apps/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: staffsync-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: staffsync-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12

databases:
  - name: staffsync-postgres
    databaseName: attendance_db
    user: attendance_user
    plan: starter
    region: oregon
