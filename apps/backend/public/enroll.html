<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Enroll Face</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .container { max-width: 720px; margin: 0 auto; }
  .card { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #94a3b8; }
  input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; box-sizing: border-box; }
  input:focus, select:focus { outline: none; border-color: #3b82f6; }
  button { background: #3b82f6; color: white; border: 0; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 8px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  video { width: 100%; border-radius: 8px; transform: scaleX(-1); background: #000; }
  canvas { display: none; }
  .log { font-family: monospace; font-size: 12px; background: #0f172a; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  .ok { color: #22c55e; }
  .err { color: #ef4444; }
  .row { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="container">
  <h1>🎥 Enroll Face</h1>

  <div class="card">
    <label>Admin JWT (from login)</label>
    <input id="token" placeholder="eyJhbGciOi..." />
    <br /><br />
    <label>Employee ID (UUID)</label>
    <input id="employeeId" placeholder="6492eb26-..." />
  </div>

  <div class="card">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <br /><br />
    <div class="row">
      <button id="start">1. Start Camera</button>
      <button id="capture" disabled>2. Capture & Enroll</button>
    </div>
  </div>

  <div class="card">
    <label>Log</label>
    <div class="log" id="log">Ready.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = (msg, cls = '') => {
  const el = $('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `\n[${t}] <span class="${cls}">${msg}</span>`;
  el.scrollTop = el.scrollHeight;
};

let stream = null;

$('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    $('video').srcObject = stream;
    $('capture').disabled = false;
    log('Camera started', 'ok');
  } catch (e) {
    log('Camera error: ' + e.message, 'err');
  }
};

$('capture').onclick = async () => {
  const token = $('token').value.trim();
  const employeeId = $('employeeId').value.trim();

  if (!token || !employeeId) {
    log('Need both token and employee ID', 'err');
    return;
  }

  const video = $('video');
  const canvas = $('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));

  const form = new FormData();
  form.append('employeeId', employeeId);
  form.append('file', blob, 'capture.jpg');

  log('Uploading…');
  try {
    const res = await fetch('/api/face/enroll', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token },
      body: form,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(data));
    log('Enrolled! dimensions=' + data.dimensions, 'ok');
  } catch (e) {
    log('Failed: ' + e.message, 'err');
  }
};
</script>
</body>
</html>
